# Server-Port
server.port=8081
server.address=${CHAT_BIND_ADDRESS:127.0.0.1}
# PostgreSQL Konfiguration
spring.datasource.url=${CHAT_DB_URL:jdbc:postgresql://localhost:5404/chatappdb}
spring.datasource.username=${CHAT_DB_USERNAME:admin}
spring.datasource.password=${CHAT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA Einstellungen
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.chat.allowed-origin=${CHAT_ALLOWED_ORIGIN:http://localhost:8081}
